name: Deploy DEV

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DEV EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd ~/devops-proj-1
            git pull origin main
            pnpm install
            pnpm build
            pm2 restart http-server
            pm2 restart ws-server
            pm2 restart web
